name: IgniteUI.Blazor.Lite Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  VERSION: ${{ github.ref_name }}
  PACKAGE_ID: IgniteUI.Blazor.Lite
  REPOSITORY_URL: https://github.com/IgniteUI/igniteui-blazor
  # Public, deliberately pinned identity. The strong-name counterpart lives in eng/IG.publickey.hex.
  EXPECTED_CERT_SHA256_PATH: "eng/IG.authenticode-certificates.sha256"

jobs:
  # Runs npm lifecycle scripts and webpack, so it is deliberately kept free of every credential:
  # no strong-name key, no Key Vault access, no publishing rights. Its only output is src/wwwroot.
  build-assets:
    name: Build web assets
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # never use caching in release builds

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript/Webpack assets
        run: npm run build

      - name: Copy component themes to wwwroot
        run: npm run copythemes

      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: src/wwwroot
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Holds the strong-name key, but no OIDC token, no Key Vault access and no publishing rights.
  # It installs no npm packages and runs no bundler, so JavaScript dependency code is never present on the runner the private key is written to.
  build:
    name: Build library
    needs: build-assets
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The Razor SDK reads wwwroot when it builds the static web asset manifest, so the assets
      # have to be in place before restore rather than merged in at pack time.
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: src/wwwroot
          digest-mismatch: error

      - name: Restore .NET dependencies
        run: dotnet restore ./src/IgniteUI.Blazor.Lite.csproj

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: |
          dotnet build ./src/IgniteUI.Blazor.Lite.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            -p:Version=${{ env.VERSION }} `
            -p:ContinuousIntegrationBuild=true `
            -p:GeneratePackageOnBuild=false `
            -p:TreatWarningsAsErrors=false `
            -p:ExposeInternalsToTests=false `
            -p:SignAssembly=true `
            -p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      # wwwroot is gitignored and produced by webpack, so this artifact is its only carrier.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            src/bin/**
            src/obj/**
            src/wwwroot/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-assemblies:
    name: Sign assemblies
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: src
          digest-mismatch: error

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/src/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem -Path "${{ github.workspace }}\src\bin\${{ env.BUILD_CONFIGURATION }}" -Filter '*.dll' -Recurse -File)
          if ($dlls.Count -eq 0) {
            throw "No DLLs found to validate."
          }

          $allowedFingerprints = @(
            Get-Content -LiteralPath $env:EXPECTED_CERT_SHA256_PATH |
              ForEach-Object { $_.Trim().ToUpperInvariant() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          )
          if ($allowedFingerprints.Count -eq 0 -or @($allowedFingerprints | Where-Object { $_ -notmatch '^[0-9A-F]{64}$' }).Count -gt 0) {
            throw "$($env:EXPECTED_CERT_SHA256_PATH) must contain at least one valid SHA-256 certificate fingerprint."
          }

          $failed = @()
          $fingerprints = @{}
          $signerNames = @{}
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += "$($dll.FullName): signature status $($sig.Status)."
              continue
            }

            $cn = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            $fingerprint = [Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData($sig.SignerCertificate.RawData)
            )
            if ($fingerprint -notin $allowedFingerprints) {
              $failed += "$($dll.FullName): certificate SHA-256 fingerprint $fingerprint is not approved by '$($env:EXPECTED_CERT_SHA256_PATH)'."
              continue
            }

            $fingerprints[$fingerprint] = $true
            $signerNames[$cn] = $true
          }
          if ($failed.Count -gt 0) {
            throw "Authenticode validation failed:`n$($failed -join "`n")"
          }

          Write-Host "All $($dlls.Count) DLLs signed by an approved certificate."
          @(
            "### Authenticode signer",
            "- Subject CN: $($signerNames.Keys -join ', ')",
            "- SHA-256 fingerprint: $($fingerprints.Keys -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assemblies
          path: |
            src/bin/**
            src/obj/**
            src/wwwroot/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack and sign package
    needs: sign-assemblies
    runs-on: windows-latest
    timeout-minutes: 20
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assemblies
          path: src
          digest-mismatch: error

      # Repository url and commit are passed explicitly: 0.1.1 shipped a nuspec carrying a commit
      # but no url, which left consumers unable to reach the source for the version they restored.
      - name: Pack NuGet package
        run: >
          dotnet pack ./src/IgniteUI.Blazor.Lite.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          -p:PackageVersion=${{ env.VERSION }}
          -p:RepositoryUrl=${{ env.REPOSITORY_URL }}
          -p:RepositoryType=git
          -p:RepositoryCommit=${{ github.sha }}
          -o "${{ github.workspace }}/artifacts"

      - name: Validate packaged assembly strong names
        shell: pwsh
        run: |
          $packagePath = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $validationRoot = "${{ runner.temp }}\strong-name-validation"
          $archivePath = "$validationRoot\package.zip"
          $extractPath = "$validationRoot\package"

          try {
            if (-not (Test-Path $packagePath)) {
              throw "NuGet package not found: $packagePath"
            }

            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item $packagePath $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

            .github/scripts/verify-strong-name.ps1 -Path $extractPath -ExpectedPublicKeyPath eng/IG.publickey.hex
          }
          finally {
            Remove-Item $validationRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate package provenance metadata
        shell: pwsh
        run: >
          .github/scripts/Assert-NuspecRepository.ps1
          -PackagePath "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg"
          -ExpectedRepositoryUrl "${{ env.REPOSITORY_URL }}"
          -ExpectedCommit "${{ github.sha }}"
          -ExpectedPackageId "${{ env.PACKAGE_ID }}"
          -ExpectedVersion "${{ env.VERSION }}"

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: Record package digest
        id: digest
        shell: pwsh
        run: |
          $name = "${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $package = "${{ github.workspace }}\artifacts\$name"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  $name" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          @("### Signed package digest", '```', "$digest  $name", '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-signed
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  # Measures the assets that were actually built, rather than a rebuild of them.
  evidence:
    name: Collect release evidence
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: src
          digest-mismatch: error

      - name: Check bundle size budget
        shell: pwsh
        run: ./eng/Check-BundleBudget.ps1

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: artifacts/perf/*
          retention-days: 30
          if-no-files-found: error

  # Advisory by design. A finding is annotated and attached to the release as evidence,
  # but never holds up the publish — the blocking gate for new vulnerable dependencies is
  # the dependency-review job on pull requests, which stops them entering master.
  dependency-scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Only what the package actually ships: the library project, and npm without devDependencies.
      - name: Scan NuGet and npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-scan

          dotnet restore ./src/IgniteUI.Blazor.Lite.csproj > /dev/null
          nuget_status=0
          dotnet list ./src/IgniteUI.Blazor.Lite.csproj package --vulnerable --include-transitive \
            --format json --output-version 1 \
            > artifacts/dependency-scan/nuget-vulnerable.json \
            2> artifacts/dependency-scan/nuget-vulnerable.stderr.txt || nuget_status=$?
          if [ "$nuget_status" -ne 0 ]; then
            cat artifacts/dependency-scan/nuget-vulnerable.stderr.txt >&2
            echo "::error title=NuGet vulnerability scan failed::dotnet list package exited with status $nuget_status."
            exit "$nuget_status"
          fi
          if ! jq -e '
            .version == 1 and
            (.parameters | type == "string") and
            (.sources | type == "array") and
            (.projects | type == "array" and length > 0) and
            all(.projects[]; (.path | type == "string" and length > 0))
          ' artifacts/dependency-scan/nuget-vulnerable.json > /dev/null; then
            echo "::error title=NuGet vulnerability scan failed::dotnet list package did not produce a valid version 1 JSON report."
            exit 1
          fi
          nuget_vulnerabilities=$(jq '[.. | objects | .vulnerabilities? | arrays | length] | add // 0' artifacts/dependency-scan/nuget-vulnerable.json)
          jq . artifacts/dependency-scan/nuget-vulnerable.json > artifacts/dependency-scan/nuget-vulnerable.txt

          npm_status=0
          npm audit --omit=dev --audit-level=info --json \
            > artifacts/dependency-scan/npm-audit.json \
            2> artifacts/dependency-scan/npm-audit.stderr.txt || npm_status=$?
          if ! jq -e '
            (.auditReportVersion | type == "number") and
            (.vulnerabilities | type == "object") and
            (.metadata.vulnerabilities.total | type == "number") and
            (has("error") | not)
          ' artifacts/dependency-scan/npm-audit.json > /dev/null; then
            cat artifacts/dependency-scan/npm-audit.stderr.txt >&2
            echo "::error title=npm vulnerability scan failed::npm audit did not produce a valid JSON report."
            exit 1
          fi
          npm_vulnerabilities=$(jq '.metadata.vulnerabilities.total' artifacts/dependency-scan/npm-audit.json)
          if ! { [ "$npm_status" -eq 0 ] && [ "$npm_vulnerabilities" -eq 0 ]; } &&
             ! { [ "$npm_status" -eq 1 ] && [ "$npm_vulnerabilities" -gt 0 ]; }; then
            cat artifacts/dependency-scan/npm-audit.stderr.txt >&2
            echo "::error title=npm vulnerability scan failed::npm audit exited with status $npm_status and reported $npm_vulnerabilities vulnerabilities."
            exit 1
          fi
          jq . artifacts/dependency-scan/npm-audit.json > artifacts/dependency-scan/npm-audit.txt

          {
            echo "### Dependency vulnerability scan"
            echo
            echo "Advisory only — findings are recorded but do not block this release."
            echo
            echo '<details><summary>dotnet list package --vulnerable --include-transitive</summary>'
            echo
            echo '```'
            cat artifacts/dependency-scan/nuget-vulnerable.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>npm audit --omit=dev</summary>'
            echo
            echo '```'
            cat artifacts/dependency-scan/npm-audit.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$nuget_vulnerabilities" -gt 0 ] || [ "$npm_vulnerabilities" -gt 0 ]; then
            echo "::warning title=Vulnerable dependencies reported::${PACKAGE_ID} ${VERSION} was released with dependency advisories outstanding. See the run summary and the dependency-scan release asset."
            echo "> ⚠️ **Vulnerable dependencies were reported for this release.** Review the scan output above and open a servicing issue if a fix is required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ✅ No vulnerable shipped dependencies reported." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dependency scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-scan
          path: artifacts/dependency-scan/*
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: Generate SBOM and attest
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attested-sha256: ${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify signed package digest
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Package digest changed between jobs. Expected $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          Write-Host "Verified package digest $digest."

      # Restores the library alone on purpose: a bare 'dotnet restore' writes project.assets.json for
      # the test, stories and template projects too, and the NuGet detector reads those.
      - name: Restore .NET dependencies
        run: dotnet restore ./src/IgniteUI.Blazor.Lite.csproj

      # Production-only, then the lockfile goes: sbom-tool's NpmWithRoots detector reads it directly
      # and an npm lockfile records the whole dev graph regardless of what is installed. Without it
      # the node_modules walk is the only npm source, which is exactly the shipped set.
      - name: Restore JavaScript dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          npm ci --omit=dev --ignore-scripts
          Remove-Item package-lock.json -Force

      # Dedicated nested manifest keeps sbom-tool out of the root 'dotnet tool restore' used by the sign steps.
      - name: Restore sbom-tool (pinned)
        run: dotnet tool restore --tool-manifest .config/sbom-tool/dotnet-tools.json

      # -b is the signed package folder, so the shipped nupkg and its hash land in the files section.
      # -bc is the repository root because the npm graph lives there alongside the .NET project.
      # External license lookup (-li) is off: it cost ~4 min a run and resolved nothing.
      - name: Generate SBOMs
        working-directory: .config/sbom-tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $formats = @(
            @{ Version = 'SPDX:2.2'; Output = 'spdx-2.2' },
            @{ Version = 'SPDX:3.0'; Output = 'spdx-3.0' }
          )

          foreach ($format in $formats) {
            $manifestDirectory = Join-Path $env:GITHUB_WORKSPACE "sbom\$($format.Output)"
            # sbom-tool requires the manifest directory to exist before generation.
            New-Item -ItemType Directory -Path $manifestDirectory -Force | Out-Null

            Write-Host "Generating $($format.Version) SBOM..."
            dotnet tool run sbom-tool -- generate `
              -b "$env:GITHUB_WORKSPACE\artifacts" `
              -bc "$env:GITHUB_WORKSPACE" `
              -m $manifestDirectory `
              -pn $env:PACKAGE_ID `
              -pv $env:VERSION `
              -ps Infragistics `
              -nsb http://spdx.org/spdxdocs/IgniteUI.Blazor.Lite `
              -mi $format.Version `
              -pm true `
              -V Information
          }

      - name: Reverify package before attestation
        id: verify-before-attestation
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Package changed before attestation. Expected $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Verified package digest $digest immediately before attestation."

      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

      # actions/attest derives the predicate from an SPDX 2.x or CycloneDX document; SPDX 3.0 ships as evidence only.
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}
          sbom-path: sbom/spdx-2.2/_manifest/spdx_2.2/manifest.spdx.json

      - name: Collect attestation bundles
        shell: pwsh
        run: |
          $target = "${{ github.workspace }}\sbom\attestations"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "${{ steps.attest-provenance.outputs.bundle-path }}" (Join-Path $target 'provenance.sigstore.json')
          Copy-Item "${{ steps.attest-sbom.outputs.bundle-path }}" (Join-Path $target 'sbom.sigstore.json')

          @(
            "### Attestations",
            "- Provenance: ${{ steps.attest-provenance.outputs.attestation-url }}",
            "- SBOM: ${{ steps.attest-sbom.outputs.attestation-url }}"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload SBOM and attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/**
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  publish:
    name: Publish to NuGet.org
    needs: [pack, evidence, sbom, dependency-scan]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: nuget-org-publish
    permissions:
      id-token: write

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify the package that was packed, signed, and attested
        shell: pwsh
        env:
          PACK_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
          ATTESTED_NUPKG_SHA256: ${{ needs.sbom.outputs.attested-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          foreach ($expected in @($env:PACK_NUPKG_SHA256, $env:ATTESTED_NUPKG_SHA256)) {
            if ($digest -ne $expected) {
              throw "Refusing to publish: expected digest $expected but found $digest."
            }
          }

          Write-Host "Publishing package with digest $digest."

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      # Refuses to publish over an existing version instead of using --skip-duplicate: a full rerun produces newly signed bytes, so skipping
      # the duplicate would attach this run's SBOM, attestations and checksum to a release whose published package is a different build.
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Pinned: a failed push is inspected through $LASTEXITCODE below rather than terminating the step.
          $PSNativeCommandUseErrorActionPreference = $false

          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $id = ($env:PACKAGE_ID).ToLowerInvariant()
          $version = ($env:VERSION).ToLowerInvariant()
          $feedUrl = "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"

          # The flat container lags a push by seconds to minutes, so the retries stop a duplicate
          # rejection from being reported as a package that never reached the feed.
          function Test-Published([int[]]$RetryDelaysSeconds = @()) {
            foreach ($delay in @(0) + $RetryDelaysSeconds) {
              if ($delay -gt 0) { Start-Sleep -Seconds $delay }
              if ((Invoke-WebRequest -Uri $feedUrl -Method Head -SkipHttpErrorCheck).StatusCode -eq 200) { return $true }
            }
            return $false
          }

          $recovery = "NuGet.org will not accept this version again. If a previous run published it but failed before attaching evidence, attach that run's retained nupkg-signed, sbom, release-evidence and dependency-scan artifacts to the release manually."

          if (Test-Published) {
            throw "$($env:PACKAGE_ID) $($env:VERSION) is already on NuGet.org, so this run must not attach its evidence to the release: the published package may be a different build. $recovery"
          }

          dotnet nuget push $package --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Published $($env:PACKAGE_ID) $($env:VERSION)."
            exit 0
          }

          Write-Host "::warning title=Push reported a failure::Checking whether the package reached NuGet.org anyway."
          if (Test-Published -RetryDelaysSeconds @(5, 15, 30)) {
            throw "dotnet nuget push reported a failure but $($env:PACKAGE_ID) $($env:VERSION) is on NuGet.org. $recovery"
          }

          throw "dotnet nuget push failed and $($env:PACKAGE_ID) $($env:VERSION) is not on NuGet.org."

  attach-to-release:
    name: Attach release evidence
    needs: [pack, evidence, sbom, dependency-scan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Download SBOM and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence

      - name: Download dependency scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-scan
          path: evidence/dependency-scan

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          (cd sbom/spdx-2.2/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-2.2.zip" .)
          (cd sbom/spdx-3.0/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-3.0.zip" .)
          (cd evidence/dependency-scan && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.dependency-scan.zip" .)

          gh release upload "$TAG" --clobber -R "${{ github.repository }}" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg.sha256" \
            "${PACKAGE_ID}.${TAG}.spdx-2.2.zip" \
            "${PACKAGE_ID}.${TAG}.spdx-3.0.zip" \
            "${PACKAGE_ID}.${TAG}.dependency-scan.zip" \
            "sbom/attestations/provenance.sigstore.json" \
            "sbom/attestations/sbom.sigstore.json" \
            "evidence/performance-report.md" \
            "evidence/performance-report.json"
