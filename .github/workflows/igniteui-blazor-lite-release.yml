name: IgniteUI.Blazor.Lite Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  VERSION: ${{ github.ref_name }}
  PACKAGE_ID: IgniteUI.Blazor.Lite
  REPOSITORY_URL: https://github.com/IgniteUI/igniteui-blazor
  # Public, deliberately pinned identity. The strong-name counterpart lives in eng/IG.publickey.hex.
  EXPECTED_CERT_SHA256_PATH: "eng/IG.authenticode-certificates.sha256"
  # Bound sbom-tool's external license lookup.
  SBOM_LICENSE_TIMEOUT_SECONDS: "180"
  # Measured on a production-only graph: 61 components, 44 of them declaring a license (72.1%).
  # The floor leaves room for the npm half, which declares nothing locally and depends on the
  # external API. 0.1.2-alpha.0 shipped 7.5%.
  SBOM_MIN_DECLARED_LICENSE_PERCENT: "50"
  # 61 components ship today (46 NuGet, 14 npm, 1 root). The ceiling catches a whole class of
  # over-reporting at once; 0.1.2-alpha.1 reached 583. Raise it only for real dependency growth.
  SBOM_MAX_COMPONENTS: "150"

jobs:
  # Holds the strong-name key, but no OIDC token, no Key Vault access and no publishing rights.
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # never use caching in release builds

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript/Webpack assets
        run: npm run build

      - name: Copy component themes to wwwroot
        run: npm run copythemes

      - name: Restore .NET dependencies
        run: dotnet restore ./src/IgniteUI.Blazor.Lite.csproj

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: |
          dotnet build ./src/IgniteUI.Blazor.Lite.csproj `
            --configuration ${{ env.BUILD_CONFIGURATION }} `
            --no-restore `
            -p:Version=${{ env.VERSION }} `
            -p:ContinuousIntegrationBuild=true `
            -p:GeneratePackageOnBuild=false `
            -p:TreatWarningsAsErrors=false `
            -p:ExposeInternalsToTests=false `
            -p:SignAssembly=true `
            -p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      # wwwroot is gitignored and produced by webpack, so this artifact is its only carrier.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            src/bin/**
            src/obj/**
            src/wwwroot/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-assemblies:
    name: Sign assemblies
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: src
          digest-mismatch: error

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/src/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem -Path "${{ github.workspace }}\src\bin\${{ env.BUILD_CONFIGURATION }}" -Filter '*.dll' -Recurse -File)
          if ($dlls.Count -eq 0) {
            throw "No DLLs found to validate."
          }

          $allowedFingerprints = @(
            Get-Content -LiteralPath $env:EXPECTED_CERT_SHA256_PATH |
              ForEach-Object { $_.Trim().ToUpperInvariant() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          )
          if ($allowedFingerprints.Count -eq 0 -or @($allowedFingerprints | Where-Object { $_ -notmatch '^[0-9A-F]{64}$' }).Count -gt 0) {
            throw "$($env:EXPECTED_CERT_SHA256_PATH) must contain at least one valid SHA-256 certificate fingerprint."
          }

          $failed = @()
          $fingerprints = @{}
          $signerNames = @{}
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += "$($dll.FullName): signature status $($sig.Status)."
              continue
            }

            $cn = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            $fingerprint = [Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData($sig.SignerCertificate.RawData)
            )
            if ($fingerprint -notin $allowedFingerprints) {
              $failed += "$($dll.FullName): certificate SHA-256 fingerprint $fingerprint is not approved by '$($env:EXPECTED_CERT_SHA256_PATH)'."
              continue
            }

            $fingerprints[$fingerprint] = $true
            $signerNames[$cn] = $true
          }
          if ($failed.Count -gt 0) {
            throw "Authenticode validation failed:`n$($failed -join "`n")"
          }

          Write-Host "All $($dlls.Count) DLLs signed by an approved certificate."
          @(
            "### Authenticode signer",
            "- Subject CN: $($signerNames.Keys -join ', ')",
            "- SHA-256 fingerprint: $($fingerprints.Keys -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assemblies
          path: |
            src/bin/**
            src/obj/**
            src/wwwroot/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack and sign package
    needs: sign-assemblies
    runs-on: windows-latest
    timeout-minutes: 20
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assemblies
          path: src
          digest-mismatch: error

      # Repository url and commit are passed explicitly: 0.1.1 shipped a nuspec carrying a commit
      # but no url, which left consumers unable to reach the source for the version they restored.
      - name: Pack NuGet package
        run: >
          dotnet pack ./src/IgniteUI.Blazor.Lite.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          -p:PackageVersion=${{ env.VERSION }}
          -p:RepositoryUrl=${{ env.REPOSITORY_URL }}
          -p:RepositoryType=git
          -p:RepositoryCommit=${{ github.sha }}
          -o "${{ github.workspace }}/artifacts"

      - name: Validate packaged assembly strong names
        shell: pwsh
        run: |
          $packagePath = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $validationRoot = "${{ runner.temp }}\strong-name-validation"
          $archivePath = "$validationRoot\package.zip"
          $extractPath = "$validationRoot\package"

          try {
            if (-not (Test-Path $packagePath)) {
              throw "NuGet package not found: $packagePath"
            }

            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item $packagePath $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

            .github/scripts/verify-strong-name.ps1 -Path $extractPath -ExpectedPublicKeyPath eng/IG.publickey.hex
          }
          finally {
            Remove-Item $validationRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate package provenance metadata
        shell: pwsh
        run: >
          .github/scripts/Assert-NuspecRepository.ps1
          -PackagePath "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg"
          -ExpectedRepositoryUrl "${{ env.REPOSITORY_URL }}"
          -ExpectedCommit "${{ github.sha }}"
          -ExpectedPackageId "${{ env.PACKAGE_ID }}"
          -ExpectedVersion "${{ env.VERSION }}"

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: Record package digest
        id: digest
        shell: pwsh
        run: |
          $name = "${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $package = "${{ github.workspace }}\artifacts\$name"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  $name" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          @("### Signed package digest", '```', "$digest  $name", '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-signed
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  # Measures the assets that were actually built, rather than a rebuild of them.
  evidence:
    name: Collect release evidence
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: src
          digest-mismatch: error

      - name: Check bundle size budget
        shell: pwsh
        run: ./eng/Check-BundleBudget.ps1

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: artifacts/perf/*
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: Generate SBOM and attest
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attested-sha256: ${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify signed package digest
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Package digest changed between jobs. Expected $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          Write-Host "Verified package digest $digest."

      # Restores the library alone on purpose. A bare 'dotnet restore' would write a
      # project.assets.json for the test, stories and template projects too, and the NuGet detector
      # reads those, putting bunit/NUnit/Playwright into an SBOM that describes a shipped package.
      - name: Restore .NET dependencies
        run: dotnet restore ./src/IgniteUI.Blazor.Lite.csproj

      # Production-only, then the lockfile goes. npm ci needs it, but sbom-tool's NpmWithRoots
      # detector reads it directly, and an npm lockfile records the whole dev graph regardless of
      # what is installed -- that is how 537 build-time components reached the 0.1.2-alpha.1 SBOM
      # even though only 14 packages were on disk. Without it the node_modules walk is the only
      # npm source, which is exactly the shipped set.
      - name: Restore JavaScript dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          npm ci --omit=dev --ignore-scripts
          Remove-Item package-lock.json -Force

      # Dedicated nested manifest keeps sbom-tool out of the root 'dotnet tool restore' used by the sign steps.
      - name: Restore sbom-tool (pinned)
        run: dotnet tool restore --tool-manifest .config/sbom-tool/dotnet-tools.json

      # -b is the signed package folder, so the shipped nupkg and its hash land in the SBOM's files
      # section. -bc is the repository root because the npm graph lives there alongside the .NET
      # project; -li/-pm resolve license and supplier metadata.
      - name: Generate SBOMs
        working-directory: .config/sbom-tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $formats = @(
            @{ Version = 'SPDX:2.2'; Output = 'spdx-2.2' },
            @{ Version = 'SPDX:3.0'; Output = 'spdx-3.0' }
          )

          foreach ($format in $formats) {
            $manifestDirectory = Join-Path $env:GITHUB_WORKSPACE "sbom\$($format.Output)"
            # sbom-tool requires the manifest directory to exist before generation.
            New-Item -ItemType Directory -Path $manifestDirectory -Force | Out-Null

            Write-Host "Generating $($format.Version) SBOM..."
            dotnet tool run sbom-tool -- generate `
              -b "$env:GITHUB_WORKSPACE\artifacts" `
              -bc "$env:GITHUB_WORKSPACE" `
              -m $manifestDirectory `
              -pn $env:PACKAGE_ID `
              -pv $env:VERSION `
              -ps Infragistics `
              -nsb http://spdx.org/spdxdocs/IgniteUI.Blazor.Lite `
              -mi $format.Version `
              -li true `
              -lto $env:SBOM_LICENSE_TIMEOUT_SECONDS `
              -pm true `
              -V Information
          }

      - name: Verify SBOM output
        shell: pwsh
        run: |
          $name = "${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $spdx22 = "${{ github.workspace }}\sbom\spdx-2.2\_manifest\spdx_2.2\manifest.spdx.json"
          $spdx30 = "${{ github.workspace }}\sbom\spdx-3.0\_manifest\spdx_3.0\manifest.spdx.json"

          foreach ($manifestPath in @($spdx22, $spdx30)) {
            if (-not (Test-Path -LiteralPath $manifestPath) -or (Get-Item -LiteralPath $manifestPath).Length -eq 0) {
              throw "SBOM manifest missing or empty: $manifestPath"
            }
          }

          $spdx = Get-Content -LiteralPath $spdx22 -Raw | ConvertFrom-Json
          $packages = @($spdx.packages)
          $problems = @()

          if (-not ($spdx.files | Where-Object { $_.fileName -like "*$name" })) {
            $problems += "The SPDX 2.2 document does not reference $name."
          }

          $buildOnly = @(
            'webpack', 'typescript', 'prettier', 'tslint', 'ts-loader', 'lint-staged', 'cross-env', 'html-webpack-plugin',
            'bunit', 'xunit', 'NUnit', 'Moq', 'coverlet.collector', 'Microsoft.NET.Test.Sdk',
            'Microsoft.Playwright.NUnit', 'Microsoft.AspNetCore.Mvc.Testing', 'BlazingStory'
          )
          $leaked = @($packages | Where-Object { $buildOnly -contains $_.name } | ForEach-Object { $_.name } | Sort-Object -Unique)
          if ($leaked.Count -gt 0) {
            $problems += "Build-only packages are in the SBOM: $($leaked -join ', '). It must be generated from a production-only restore and install."
          }

          # The blocklist only catches names someone thought of; the ceiling catches the rest.
          $ceiling = [int]$env:SBOM_MAX_COMPONENTS
          if ($packages.Count -gt $ceiling) {
            $problems += "The SBOM lists $($packages.Count) components, over the $ceiling ceiling. Something is contributing dependencies the package does not ship."
          }

          $shipped = @('igniteui-webcomponents', 'lit-html', 'Microsoft.AspNetCore.Components.Web')
          $missing = @($shipped | Where-Object { $packages.name -notcontains $_ })
          if ($missing.Count -gt 0) {
            $problems += "Shipped dependencies are absent from the SBOM: $($missing -join ', ')."
          }

          # licenseDeclared comes from local package metadata; licenseConcluded comes from the
          # external license API, so only the former is gated. An API outage is reported, not fatal.
          $declared = @($packages | Where-Object { $_.licenseDeclared -and $_.licenseDeclared -ne 'NOASSERTION' }).Count
          $concluded = @($packages | Where-Object { $_.licenseConcluded -and $_.licenseConcluded -ne 'NOASSERTION' }).Count
          $declaredPercent = if ($packages.Count -gt 0) { [math]::Round(100 * $declared / $packages.Count, 1) } else { 0 }
          $floor = [double]$env:SBOM_MIN_DECLARED_LICENSE_PERCENT

          if ($declaredPercent -lt $floor) {
            $problems += "Only $declaredPercent% of $($packages.Count) components declare a license, below the $floor% floor."
          }

          @(
            "### SBOM",
            "- Components: $($packages.Count) (ceiling $ceiling), files: $($spdx.files.Count)",
            "- Declared licenses: $declared ($declaredPercent%), floor $floor%",
            "- Licenses resolved from the external API: $concluded"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          if ($concluded -eq 0) {
            Write-Warning "The external license API resolved nothing. Check the sbom-tool warnings above for an outage."
          }

          if ($problems.Count -gt 0) {
            throw "SBOM validation failed:`n- $($problems -join "`n- ")"
          }

          Write-Host "SBOM covers $($packages.Count) packages and $($spdx.files.Count) files; $declaredPercent% declare a license."

      - name: Reverify package before attestation
        id: verify-before-attestation
        shell: pwsh
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($digest -ne $env:EXPECTED_NUPKG_SHA256) {
            throw "Package changed before attestation. Expected $($env:EXPECTED_NUPKG_SHA256) but found $digest."
          }

          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Verified package digest $digest immediately before attestation."

      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}

      # actions/attest derives the predicate from an SPDX 2.x or CycloneDX document; SPDX 3.0 ships as evidence only.
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.verify-before-attestation.outputs.nupkg-sha256 }}
          sbom-path: sbom/spdx-2.2/_manifest/spdx_2.2/manifest.spdx.json

      - name: Collect attestation bundles
        shell: pwsh
        run: |
          $target = "${{ github.workspace }}\sbom\attestations"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "${{ steps.attest-provenance.outputs.bundle-path }}" (Join-Path $target 'provenance.sigstore.json')
          Copy-Item "${{ steps.attest-sbom.outputs.bundle-path }}" (Join-Path $target 'sbom.sigstore.json')

          @(
            "### Attestations",
            "- Provenance: ${{ steps.attest-provenance.outputs.attestation-url }}",
            "- SBOM: ${{ steps.attest-sbom.outputs.attestation-url }}"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload SBOM and attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/**
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  publish:
    name: Publish to NuGet.org
    needs: [pack, evidence, sbom]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: nuget-org-publish
    permissions:
      id-token: write

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Verify the package that was packed, signed, and attested
        shell: pwsh
        env:
          PACK_NUPKG_SHA256: ${{ needs.pack.outputs.nupkg-sha256 }}
          ATTESTED_NUPKG_SHA256: ${{ needs.sbom.outputs.attested-sha256 }}
        run: |
          $package = "${{ github.workspace }}\artifacts\${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          foreach ($expected in @($env:PACK_NUPKG_SHA256, $env:ATTESTED_NUPKG_SHA256)) {
            if ($digest -ne $expected) {
              throw "Refusing to publish: expected digest $expected but found $digest."
            }
          }

          Write-Host "Publishing package with digest $digest."

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}/artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"

  attach-to-release:
    name: Attach release evidence
    needs: [pack, evidence, sbom, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: artifacts

      - name: Download SBOM and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          (cd sbom/spdx-2.2/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-2.2.zip" .)
          (cd sbom/spdx-3.0/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-3.0.zip" .)

          gh release upload "$TAG" --clobber -R "${{ github.repository }}" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg" \
            "artifacts/${PACKAGE_ID}.${TAG}.nupkg.sha256" \
            "${PACKAGE_ID}.${TAG}.spdx-2.2.zip" \
            "${PACKAGE_ID}.${TAG}.spdx-3.0.zip" \
            "sbom/attestations/provenance.sigstore.json" \
            "sbom/attestations/sbom.sigstore.json" \
            "evidence/performance-report.md" \
            "evidence/performance-report.json"
